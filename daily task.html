<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="dailytask.css">
</head>
<body>
    <script src="script.js"></script>

      <header class="top-header">
       <h2>Hello,Deeksha!</h2>
       <p>Let's finish your task today!</p>
     </header>


    <div class="task-manager">

        <aside class="sidebar">

         <nav class="nav">
           <div class="logo">
             <h1>Habit Tracker</h1>
             <p>Better Habit , Better YOU</p>
           </div>
            <a href="index.html">Dashboard</a>
            <a href="daily task.html">Daily Tasks</a>
            <a href="#">Habit Tracker</a>
            <a href="water.html">Water Tracker</a>
            <a href="sleep.html">Sleep Tracker</a>
            <a href="timer.html">Pomodoro Timer</a>
            <a href="#">Profile</a>
         </nav>
       </aside>

       <main class="main-content">

          <div class="cards-top">

           <section class="today-task">
             <h1>Today Task</h1>
             <p> Check your daily tasks and schedule</p>
             <button>Today's Schedule</button>
           </section>

           <div class="add-task">
            <h2> Update your task</h2>

           </div>

          </div>

          <div class="cards">

            <div class="task1">
                <h2>TASK1</h2>
            </div>
            
            <div class="task2">
                <h2>TASK2</h2>
            </div>

            <div class="task3">
                <h2>TASK3</h2>
            </div>

          </div>

          <div class="cards2">

            <div class="graph">
              <h2> Tasks Progress</h2>
            </div>

           <div class="assignments">
             <h2>Assignments</h2>
           </div>

          </div>



       </main>
        

    </div>
</body>
</html>
