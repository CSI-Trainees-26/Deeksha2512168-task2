<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
        <link rel="stylesheet" href="water.css">
</head>
<body>

    <header class="top-header">
       <h2>Hello,Deeksha!</h2>
       <p>Water Today</p>
    </header>

    <div class="water-track">
        <aside class="sidebar">

         <nav class="nav">
           <div class="logo">
             <h1>Habit Tracker</h1>
             <p>Better Habit , Better YOU</p>
           </div>
            <a href="index.html">Dashboard</a>
            <a href="dailytask.html">Daily Tasks</a>
            <a href="#">Habit Tracker</a>
            <a href="water.html">Water Tracker</a>
            <a href="sleep.html">Sleep Tracker</a>
            <a href="#">Pomodoro Timer</a>
            <a href="#">Profile</a>
         </nav>
       </aside>

       <main class="main-content">

        <div class="cards-top">

          <div class="intake">
            <h1>Today's Intake</h1>
            <h1 id="todayIntakeValue">0</h1>
            <p id="goalText">of 5L</p>
          </div>

          <div class="add">
            <h1>Add today's intake</h1>
            <button id="add250Btn">250ml</button>
            <button id="add500Btn">500ml</button>
          </div>

        </div>

        <div class="report">

            <div class="week">
                <h1>Weekly Intake</h1>
                <div class="chart-container">
                    <canvas id="weekChartCanvas"></canvas>
                </div>
            </div>

            <div class="month">
                <h1>Monthly Intake</h1>
                <div class="chart-container">
                    <canvas id="monthChartCanvas"></canvas>
                </div>
            </div>
        </div>
       </main>

    </div>

    <script src="water.js"></script>
</body>
</html>
