<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
        <link rel="stylesheet" href="water.css">
</head>
<body>

    <header class="top-header">
      <div class="pfp-logo1">
        <img src="https://thumbs.dreamstime.com/b/default-avatar-profile-icon-vector-social-media-user-image-182145777.jpg" alt="profile logo" class="logo-icon">
        <h2>Hello,Deeksha!</h2>
       </div>
       <p>Water Today</p>

       <div class="header-icon">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ1Eug4dg0tkjue_9In33khVYBN0_0JKqMXbcnCVC9bTQ&s" alt="search-icon" class="search-logo">
        <img src="https://thumbs.dreamstime.com/b/notification-icon-vector-material-design-social-media-element-user-interface-sign-eps-ui-image-illustration-new-message-bell-icons-107566385.jpg" alt="notification" class="notify">
       </div>
    </header>

    <div class="water-track">
        <aside class="sidebar">

         <nav class="nav">
           <div class="logo">
             <div class="logo-top">
                <img src="https://healthicons.org/icons/svg/outline/devices/blood-pressure.svg" alt="health tracker logo" class="logo-icon">
                <h1>Health Tracker</h1>
             </div>
             <p>Better Habit , Better YOU</p>
           </div>
             <a href="index.html"><img src="https://static.vecteezy.com/system/resources/previews/012/528/164/non_2x/home-icon-house-icon-illustration-perfect-for-all-project-vector.jpg" alt="dash-icon" class="nav-icon">Dashboard</a>
            <a href="dailytask.html"> <img src="https://cdn-icons-png.flaticon.com/512/233/233146.png" alt="dash-icon" class="nav-icon">Daily Tasks</a>
            <a href="habit.html"><img src="https://www.shutterstock.com/image-vector/habit-icon-represented-by-man-600w-2609209517.jpg" alt="dash-icon" class="nav-icon"Habit Tracker>Habit Tracker</a>
            <a href="water.html"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQd_y28CZEuK7GG6_nCud89lVbDU_O0y0yazrbPSp1q4wLCOpWqDplcfvBm&s=10" alt="dash-icon" class="nav-icon"Habit Tracker>Water Tracker</a>
            <a href="sleep.html"><img src="https://media.istockphoto.com/id/1142805287/vector/man-sleeping-on-bed.jpg?s=612x612&w=0&k=20&c=Hu2BpHdt2AokYEKV9ipExTUT8AMvImjayo1Tuy5nISs=" alt="dash-icon" class="nav-icon"Habit Tracker>Sleep Tracker</a>
            <a href="timer.html"><img src="https://assets.streamlinehq.com/image/private/w_300,h_300,ar_1/f_auto/v1/icons/all-icons/timer-xizuqis1c1bft3afx5g9g.png/timer-417zrzd2bpc0rtyd5pzkjlg.png?_a=DATAiZAAZAA0" alt="dash-icon" class="nav-icon"Habit Tracker>Pomodoro Timer</a>
            <a href="#"><img src="https://www.iconpacks.net/icons/2/free-user-icon-3296-thumb.png" alt="dash-icon" class="nav-icon">Profile</a>
         </nav>
       </aside>

       <main class="main-content">

        <div class="cards-top">

          <div class="intake">
            <h1>Today's Intake</h1>
            <h1 id="todayIntakeValue">0</h1>
            <p id="goalText">of 5L</p>
          </div>

          <div class="add">
            <h1>Add today's intake</h1>
            <button id="add250Btn">250ml</button>
            <button id="add500Btn">500ml</button>
          </div>

        </div>

        <div class="report">

            <div class="week">
                <h1>Weekly Intake</h1>
                <div class="chart-container">
                    <canvas id="weekChartCanvas"></canvas>
                </div>
            </div>

            <div class="month">
                <h1>Monthly Intake</h1>
                <div class="chart-container">
                    <canvas id="monthChartCanvas"></canvas>
                </div>
            </div>
        </div>
       </main>

    </div>

    <script src="water.js"></script>
</body>
</html>
