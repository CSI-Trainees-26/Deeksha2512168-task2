<!DOCTYPE htmtent"l>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="script.js"></script>

    <header class="top-header">
       <h2>Hello,Deeksha!</h2>
       <p>05 September</p>
    </header>


    <div class="dashboard">
     
       <aside class="sidebar">

         <nav class="nav">
            <a href="#">Dashboard</a>
            <a href="#">Activity</a>
            <a href="#">Sleep</a>
            <a href="#">Heart Rate</a>
            <a href="#">Profile</a>
         </nav>
       </aside>

       <main class=" main-content">
          
            <section class=" progress-report ">
                <h2> Overall Progress </h2>
       
                <div class="progress-circle">
                   <span>92%</span>
                </div>
            </section>

            <div class="cards">

             <div class="habit-progress">
                <h3>My Activity Recaps</h3>
                <p>Everything you have completed </p>
             </div>

             <div class="right-cards">

                 <div class="water-intake">
                   <h3>💧Water</h3>
                   <p>Daily Limit- 5L</p>
                 </div>

                  <div class="calorie">
                    <h3>🔥Calorie</h3>
                  </div>
             </div>

            </div>

            <section class="quotes">
                <h1> Motivational Quotes</h1>
            </section>

            <div class="cards2">

                <div class="sleep">
                  <h2>Sleep Quality</h2>
                </div>

                <div class="timer">
                    <h3> Set Timer</h3>
                </div>

            </div>

        </main>
    
    </div>
   
</body>
</html>
